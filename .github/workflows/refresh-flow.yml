# Optional scheduled job for the GitHub Pages repo (apolloqlabs).
# Updates flow.json every 15 minutes during U.S. regular market hours (Mon-Fri).
name: Refresh delayed options flow
on:
  schedule:
    # 14:00-21:45 UTC = 9:00 AM-4:45 PM ET / 8:00 AM-3:45 PM CT (covers DST + standard time)
    - cron: '*/15 14-21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch 15-min delayed options chain snapshot from Nasdaq
        run: python3 fetch-flow.py
      - name: Commit flow.json when updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flow.json
          if git diff --staged --quiet; then
            echo "No options flow changes."
          else
            git commit -m "Refresh delayed options flow"
            git push
          fi
